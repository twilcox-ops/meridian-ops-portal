# CI validation — runs on every push to main.
#
# Checks that the three things this repo ships (the Python package/test
# suite, the Docker image, and the Bicep IaC) each still build cleanly.
# It does NOT deploy anything: no docker push, no az login, no az
# deployment, no registry or Azure credentials are touched or required.
# Deploying is a separate, not-yet-built step — see deploy/README.md.

name: deploy

on:
  push:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          # app.py raises at import time if this is unset — checked, and
          # it's the only environment variable config.py requires at
          # import time (DATABASE_URL falls back to sqlite; the Entra
          # vars are Optional and only read lazily when /login is hit).
          # Not a real secret — same role deploy/.env.docker-test's key
          # plays locally, just satisfying that import-time check.
          SESSION_SECRET_KEY: ci-test-placeholder-not-a-real-secret
        run: pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t meridian-ops-portal -f deploy/Dockerfile .

      - name: Install Bicep CLI
        run: az bicep install

      - name: Validate Bicep template compiles
        run: az bicep build --file deploy/main.bicep
