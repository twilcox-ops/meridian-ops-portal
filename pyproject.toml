[project]
name = "meridian-ops-portal"
version = "0.1.0"
description = "Authenticated operations portal consolidating the scheduled ingestion pipeline, document extraction review queue, and LLM ticket triage, plus its own asset-registry normalization pipeline, behind Entra ID SSO with role-based server-side authorization, a maker-checker approval workflow, and an append-only audit log."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "msal>=1.28",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Every router's Jinja2Templates(directory=...) resolves templates/ (and,
# once static/ is mounted — see app.py's TODO) relative to the *installed*
# ops_portal package's own location on disk (Path(__file__).resolve()...),
# not to a source checkout. setuptools only includes .py files in a wheel
# by default, so without this, `pip install .` (deploy/Dockerfile's
# builder stage) would silently produce a working import but a 500 on
# every page route the moment it tried to render a template.
[tool.setuptools.package-data]
ops_portal = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
